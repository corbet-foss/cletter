name: Publish prepared public packages
on:
  workflow_dispatch:
    inputs:
      bundle_url:
        description: Public release asset URL for the verified publication bundle
        type: string
        required: true
      bundle_sha256:
        description: SHA-256 from the reviewed bundle import receipt
        type: string
        required: true
      channels:
        description: Comma-separated registries; hosted publication supports cargo
        type: string
        required: true
        default: all
      operation:
        description: Inspect live package bytes or publish through configured Cargo OIDC
        type: choice
        options: [status, publish]
        default: status
permissions:
  contents: read
concurrency:
  group: prepared-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      CCID_REVISION: 33600b394910c643c5a6af6dff479fb16418428a
      RELEASE_BUNDLE_URL: ${{ inputs.bundle_url }}
      RELEASE_BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
      RELEASE_CHANNELS: ${{ inputs.channels }}
      RELEASE_OPERATION: ${{ inputs.operation }}
    steps:
      - name: Check out the publication adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out the exact shared publisher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: corbet-infra/ccid
          ref: 33600b394910c643c5a6af6dff479fb16418428a
          path: .release-publisher-source
          persist-credentials: false
      - name: Verify shared source and select suitable hosted work
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_BUNDLE=$RUNNER_TEMP/publication-bundle.tar" >> "$GITHUB_ENV"
          echo "RELEASE_JOURNAL_ROOT=$RUNNER_TEMP/publication-journals" >> "$GITHUB_ENV"
          if [[ "$RELEASE_OPERATION" == publish && "$RELEASE_CHANNELS" != cargo ]]; then
            echo 'Hosted publication uses Cargo OIDC. Select Crow for token-based npm, JSR or PyPI publication.' >&2
            exit 2
          fi
          test "$(git -C .release-publisher-source rev-parse HEAD)" = "$CCID_REVISION"
          tool_archive="$RUNNER_TEMP/publisher-source.tar"
          git -C .release-publisher-source archive --format=tar HEAD > "$tool_archive"
          tool_sha256=$(sha256sum "$tool_archive" | cut -d ' ' -f 1)
          echo "CI_TOOL_ARCHIVE=$tool_archive" >> "$GITHUB_ENV"
          echo "CI_TOOL_SHA256=$tool_sha256" >> "$GITHUB_ENV"
      - name: Reconcile exact existing registry bytes
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .ci/publish.py status > "$RUNNER_TEMP/publication-status.json"
          cat "$RUNNER_TEMP/publication-status.json"
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'publication-status.json').read_text())
          missing = bool(result['registries'].get('cargo', {}).get('missing'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('cargo_missing=' + str(missing).lower() + '\n')
          PYTHON
      - name: Obtain short-lived Cargo publishing authentication
        if: inputs.operation == 'publish' && steps.status.outputs.cargo_missing == 'true'
        id: authentication
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Publish the same inspected Cargo archive
        if: inputs.operation == 'publish' && steps.status.outputs.cargo_missing == 'true'
        env:
          RELEASE_CARGO_AUTH: trusted
          CARGO_REGISTRY_TOKEN: ${{ steps.authentication.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .ci/publish.py publish
      - name: Retain inspection and local publication records
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: publication-records-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/publication-status.json
            ${{ runner.temp }}/publication-journals
          if-no-files-found: ignore
          retention-days: 90
