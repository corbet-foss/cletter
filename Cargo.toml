[package]
name = "cletter"
version = "0.4.1"
edition = "2024"
rust-version = "1.94"
description = "Locale-correct business correspondence: composes cnice, cink and cdate with locale tables for opening, subject, resolution and orthography"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://github.com/corbet-foss/cletter"

documentation = "https://docs.rs/cletter"
keywords = ["i18n", "correspondence", "locale"]
categories = ["internationalization", "text-processing"]

include = ["Cargo.toml", "Cargo.lock", "src/**", "tables/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE", "LICENSE.md", "LICENSES/Apache-2.0.txt", "LICENSES/GPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/LGPL-3.0-only.txt", "LICENSES/MIT.txt"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"

[dependencies]
cdate = "0.3.0"
cnice = "0.1"
cink = "0.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
